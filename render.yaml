# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: Render Dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: digistyle
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_ENV
        value: production
      # Generated once by Render and kept in sync on later deploys.
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      # Fresh database: create tables and seed it on the first boot.
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: SEED_ON_BOOT
        value: "1"
      # رمز اولیهٔ حساب‌ها: مقدار تصادفی در پنل Render ساخته می‌شود و در لاگ
      # چاپ نمی‌شود. بعد از اولین دیپلوی از Environment همین‌جا ببینید/عوض کنید.
      - key: SEED_OWNER_PASSWORD
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      # دیتابیس: داده‌ها (محصولات، سفارش‌ها، تنظیمات) باید دائمی بمانند، پس از یک
      # Postgres مدیریت‌شدهٔ مجانی مثل Neon استفاده می‌کنیم. رشتهٔ اتصال را موقع
      # ساخت Blueprint (یا بعد از آن در Environment) وارد کنید.
      #
      # اگر ترجیح می‌دهید دیتابیس خود Render را داشته باشید، این را به شکل زیر
      # عوض کنید و بلوک `databases` را در انتهای فایل برگردانید — فقط حواستان
      # باشد پلن رایگان Postgres روی Render بعد از ۳۰ روز منقضی می‌شود.
      #   - key: DATABASE_URL
      #     fromDatabase:
      #       name: digistyle-db
      #       property: connectionString
      - key: DATABASE_URL
        sync: false
