<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فروشگاه | کدلاین</title>
  <meta name="description" content="خرید آنلاین پوشاک مردانهٔ کدلاین؛ فیلتر بر اساس دسته‌بندی، سایز، رنگ و قیمت. پولوشرت، پیراهن، بافت، شلوار، پالتو و اکسسوری.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="author" content="Codelaine">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">

  <div data-site-header></div>

  <main>
    <div class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="مسیر صفحه">
          <a href="index.html">خانه</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
          <a href="shop.html">پوشاک</a>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 6-6 6 6 6"/></svg>
          <span data-crumb>لباس مردانه</span>
        </nav>
        <h1 class="page-head__title" data-page-title>لباس مردانه</h1>
        <p class="page-head__desc" data-page-desc>
          مجموعه‌ای از پوشاک ساده و کاربردی با پارچه‌های طبیعی. برای پیدا کردن سریع‌تر، از فیلترهای سمت راست استفاده کنید.
        </p>
      </div>
    </div>

    <div class="container">
      <div class="shop">

        <!-- فیلترها -->
        <aside class="filters" data-filters aria-label="فیلتر محصولات">
          <div class="filters__head">
            <strong>فیلترها</strong>
            <button class="filters__reset" type="button" data-reset>حذف همه</button>
            <button class="filters__close" type="button" data-filters-close aria-label="بستن فیلترها">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="fgroup">
            <h3 class="fgroup__title">دسته‌بندی</h3>
            <div class="fgroup__body" data-filter-cats>
              <!-- با جاوااسکریپت پر می‌شود -->
            </div>
          </div>

          <div class="fgroup">
            <h3 class="fgroup__title">سایز</h3>
            <div class="sizes" data-filter-sizes></div>
            <p class="filters-note">سایز را از جدول سایز محصول بررسی کنید.</p>
          </div>

          <div class="fgroup">
            <h3 class="fgroup__title">رنگ</h3>
            <div class="colors" data-filter-colors></div>
          </div>

          <div class="fgroup">
            <h3 class="fgroup__title">حداکثر قیمت</h3>
            <div class="price-range">
              <input type="range" min="150000" max="9000000" step="50000" value="9000000" data-filter-price aria-label="حداکثر قیمت">
              <div class="price-range__row">
                <span>۱۵۰ هزار تومان</span>
                <b data-price-label>۹,۰۰۰,۰۰۰ تومان</b>
              </div>
            </div>
          </div>

          <div class="fgroup">
            <h3 class="fgroup__title">سایر</h3>
            <label class="check">
              <input type="checkbox" data-filter-sale>
              <span class="check__box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
              </span>
              فقط محصولات تخفیف‌دار
            </label>
          </div>
        </aside>

        <div class="filters-backdrop" data-filters-backdrop></div>

        <!-- لیست محصولات -->
        <div>
          <div class="toolbar">
            <span class="toolbar__count"><b data-result-count>۰</b> محصول</span>

            <div class="toolbar__right">
              <button class="filter-open" type="button" data-filters-open>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
                فیلترها
              </button>

              <div class="select">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
                <select data-sort aria-label="مرتب‌سازی">
                  <option value="newest">جدیدترین</option>
                  <option value="popular">محبوب‌ترین</option>
                  <option value="cheap">ارزان‌ترین</option>
                  <option value="expensive">گران‌ترین</option>
                  <option value="discount">بیشترین تخفیف</option>
                </select>
              </div>

              <div class="view-toggle" role="group" aria-label="نوع نمایش">
                <button type="button" class="is-active" data-view="grid" aria-label="نمایش شبکه‌ای">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg>
                </button>
                <button type="button" data-view="list" aria-label="نمایش لیستی">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="products" data-products>
            <!-- کارت‌ها با جاوااسکریپت رندر می‌شوند -->
          </div>
        </div>

      </div>
    </div>
  </main>

  <div data-site-footer></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
